# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "exomecnvtocsv"
description: Summarizes ExomeDepth CNV calls from VEP-annotated VCFs into per-design and per-panel TSV reports for a full SeqCap run.
keywords:
  - report
  - cnv
  - exomedepth
  - exomecnv
  - seqcap

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing run information
          e.g. `[ id:'run1' ]`
    - samplesheet:
        type: file
        description: Comma-separated samplesheet describing sample/design/panel and their gene list, VCF and CNV database files.
        pattern: "*.csv"
  - - input_files:
        type: file
        description: All files referenced by the samplesheet (design gene list, panel gene list, VCF, CNV database), staged so they are available to the script.

output:
  - summaries:
      - meta:
          type: map
          description: |
            Groovy Map containing run information
            e.g. `[ id:'run1' ]`
      - "*.tsv":
          type: file
          description: Per-design and per-panel ExomeDepth CNV summary TSV reports.
          pattern: "*.tsv"
  - versions:

authors:
  - "@ToonRosseel"
maintainers:
  - "@ToonRosseel"
